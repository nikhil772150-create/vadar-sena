version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: bvsms_db
    environment:
      POSTGRES_DB: bvsms_db
      POSTGRES_USER: bvsms_user
      POSTGRES_PASSWORD: bvsms_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bvsms_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=django-insecure-docker-dev-key
      - DEBUG=True
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=bvsms_db
      - DB_USER=bvsms_user
      - DB_PASSWORD=bvsms_secure_password
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bvsms_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
