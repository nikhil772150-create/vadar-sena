name: BVSMS Production CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Test Suite & Security Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: bvsms_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements/local.txt

      - name: Run Database Migrations
        env:
          SECRET_KEY: "ci-secret-key-production-verification"
          DB_HOST: "localhost"
          DB_PORT: "5432"
          DB_NAME: "bvsms_test_db"
          DB_USER: "postgres"
          DB_PASSWORD: "postgrespassword"
        run: |
          python backend/manage.py migrate

      - name: Run Backend Test Suite
        env:
          SECRET_KEY: "ci-secret-key-production-verification"
          DB_HOST: "localhost"
          DB_PORT: "5432"
          DB_NAME: "bvsms_test_db"
          DB_USER: "postgres"
          DB_PASSWORD: "postgrespassword"
        run: |
          python backend/manage.py test

  frontend-build:
    name: Frontend Build & Type Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Production Bundle
        run: |
          cd frontend
          npm run build
